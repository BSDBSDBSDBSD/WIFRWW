name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build both flavor debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netfree-lock-key-apks
          path: |
            app/build/outputs/apk/lock/debug/app-lock-debug.apk
            app/build/outputs/apk/key/debug/app-key-debug.apk

      - name: Commit APKs into repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p release
          cp app/build/outputs/apk/lock/debug/app-lock-debug.apk release/app-lock-debug.apk
          cp app/build/outputs/apk/key/debug/app-key-debug.apk release/app-key-debug.apk
          git add release/app-lock-debug.apk release/app-key-debug.apk -f
          git commit -m "Add built Lock/Key APKs [skip ci]" || echo "Nothing to commit"
          git push
