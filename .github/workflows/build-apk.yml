name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netfreeguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK into repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/app-debug.apk
          git add release/app-debug.apk -f
          git commit -m "Add built APK [skip ci]" || echo "Nothing to commit"
          git push
