plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.netfreeguard.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.netfreeguard.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "role"
    productFlavors {
        lock {
            dimension "role"
            applicationIdSuffix ".lock"
            buildConfigField "boolean", "IS_LOCK", "true"
            resValue "string", "app_name", "Netfree Lock"
        }
        key {
            dimension "role"
            applicationIdSuffix ".key"
            buildConfigField "boolean", "IS_LOCK", "false"
            resValue "string", "app_name", "Netfree Key"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
